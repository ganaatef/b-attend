name: Biometric schema patch

on:
  push:
    branches:
      - integration/face-liveness
    paths:
      - scripts/biometric-schema-patch.mjs

permissions:
  contents: write

jobs:
  patch-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/face-liveness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent biometric schema patch
        run: node scripts/biometric-schema-patch.mjs
      - name: Commit generated schema
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "Schema already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat(biometrics): add enrollment and liveness persistence"
          git push origin HEAD:integration/face-liveness
