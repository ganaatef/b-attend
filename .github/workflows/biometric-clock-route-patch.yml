name: Biometric clock route patch

on:
  push:
    branches:
      - integration/face-liveness
    paths:
      - scripts/biometric-clock-route-patch.mjs

permissions:
  contents: write

jobs:
  patch-clock-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/face-liveness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent clock route patch
        run: node scripts/biometric-clock-route-patch.mjs
      - name: Commit generated route
        run: |
          if git diff --quiet -- src/app/api/mobile/clock/route.ts; then
            echo "Route already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/mobile/clock/route.ts
          git commit -m "feat(attendance): atomically consume biometric proof with punch"
          git push origin HEAD:integration/face-liveness
