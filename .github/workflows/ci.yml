name: CI

on:
  push:
    branches: [main, release/**, integration/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
      NEXT_PUBLIC_DEMO_MODE: "true"
      RUN_PRISMA_MIGRATIONS: "false"
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n parity check
        run: npm run i18n:check

      - name: Tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  runtime-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battend_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battend_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/battend_runtime_test
      SESSION_SECRET: ci-runtime-secret-for-tests-only-32chars!!
      NEXT_PUBLIC_DEMO_MODE: "true"
      RUN_PRISMA_MIGRATIONS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to ephemeral Postgres
        run: npx prisma migrate deploy

      - name: Database-backed authorization and isolation tests
        run: npx vitest run --config vitest.runtime.config.ts

  # Deploy only after both static/unit/build verification and real PostgreSQL
  # runtime authorization/isolation tests succeed. Integration branches remain
  # verification-only and can never deploy from this workflow.
  deploy:
    needs: [build-test, runtime-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Yv5yJW5Al6lnp1tkZSQjGTAo
      VERCEL_PROJECT_ID: prj_R4yJVc6wBnGiK1zjdeQ3W52w0wIF
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy app to git-free staging dir
        run: |
          mkdir -p /tmp/b-attend-deploy
          tar --exclude=.git --exclude=node_modules --exclude=.next -cf - . | tar -xf - -C /tmp/b-attend-deploy

      - name: Deploy to Vercel (Preview) - release branches only
        if: startsWith(github.ref, 'refs/heads/release/')
        working-directory: /tmp/b-attend-deploy
        run: npx vercel deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production) - main only
        if: github.ref == 'refs/heads/main'
        working-directory: /tmp/b-attend-deploy
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
