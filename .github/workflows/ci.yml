name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
      NEXT_PUBLIC_DEMO_MODE: "true"
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: i18n parity check
        run: npm run i18n:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Deploy runs ONLY after build-test succeeds (needs: build-test).
  # Production is deployed ONLY from main. Release branches deploy to Preview only.
  deploy:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Yv5yJW5Al6lnp1tkZSQjGTAo
      VERCEL_PROJECT_ID: prj_R4yJVc6wBnGiK1zjdeQ3W52w0wIF
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy app to git-free staging dir
        run: |
          mkdir -p /tmp/b-attend-deploy
          tar --exclude=.git --exclude=node_modules --exclude=.next -cf - . | tar -xf - -C /tmp/b-attend-deploy

      - name: Deploy to Vercel (Preview) - release branches only
        if: github.ref != 'refs/heads/main'
        working-directory: /tmp/b-attend-deploy
        run: npx vercel deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production) - main only
        if: github.ref == 'refs/heads/main'
        working-directory: /tmp/b-attend-deploy
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
