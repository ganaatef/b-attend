name: Guarded Attendance Trust Normalization

on:
  push:
    branches: [integration/main-reconcile]
    paths:
      - .github/trust-normalization-v2.request

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
  NEXT_PUBLIC_DEMO_MODE: "true"
  RUN_PRISMA_MIGRATIONS: "false"

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply trust normalization patch
        run: node scripts/apply-trust-normalization-v2.mjs
      - name: Format and verify schema
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified trust normalization foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260910020000_attendance_trust_normalization src/lib/attendance/trust-policy.ts src/lib/attendance/trust-persistence.ts
          if git diff --cached --quiet; then
            echo "Trust normalization already applied"
          else
            git commit -m "feat(attendance): normalize trust assessments and tenant policy"
            git push origin HEAD:integration/main-reconcile
          fi
