name: Rekognition region patch

on:
  push:
    branches:
      - integration/face-liveness
    paths:
      - scripts/rekognition-region-patch.mjs

permissions:
  contents: write

jobs:
  patch-rekognition-region:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/face-liveness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime region validation
        run: node scripts/rekognition-region-patch.mjs
      - name: Commit Rekognition region validation
        run: |
          if git diff --quiet -- src/lib/attendance/providers/aws-rekognition-biometric.ts; then
            echo "Region validation already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/attendance/providers/aws-rekognition-biometric.ts
          git commit -m "fix(biometrics): reject unsupported Face Liveness regions at runtime"
          git push origin HEAD:integration/face-liveness
