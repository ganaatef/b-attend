name: Production Dependency Audit

on:
  push:
    branches: [integration/main-reconcile]
    paths:
      - .github/workflows/dependency-audit.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Public launch gate: production dependency high/critical advisories must be resolved.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
