name: Enterprise IAM Schema Refactor

on:
  push:
    branches:
      - integration/main-reconcile
    paths:
      - .github/enterprise-refactor.request

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
      SESSION_SECRET: ci-enterprise-schema-refactor-secret-32chars
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply IAM schema patch
        run: node scripts/apply-enterprise-schema.mjs
      - name: Prisma format
        run: npx prisma format
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit schema result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          if git diff --cached --quiet; then
            echo "Schema already patched"
          else
            git commit -m "feat(iam): apply enterprise access-control schema"
            git push origin HEAD:integration/main-reconcile
          fi
