name: Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character SHA currently at main HEAD"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_PRODUCTION exactly"
        required: true
        type: string
      billing_mode:
        description: "Production billing mode for this release"
        required: true
        default: sales_assisted
        type: choice
        options:
          - sales_assisted
          - self_service
      payment_provider:
        description: "Configured production payment provider"
        required: true
        default: manual
        type: choice
        options:
          - manual
          - paymob

permissions:
  contents: read
  actions: read

concurrency:
  group: b-attend-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, migrate and deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      VERCEL_ORG_ID: team_Yv5yJW5Al6lnp1tkZSQjGTAo
      VERCEL_PROJECT_ID: prj_R4yJVc6wBnGiK1zjdeQ3W52w0wIF
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "DEPLOY_PRODUCTION" ]; then
            echo "Production confirmation did not match DEPLOY_PRODUCTION."
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact 40-character commit SHA."
            exit 1
          fi

      - name: Checkout exact requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require SHA to equal current main HEAD
        shell: bash
        run: |
          git fetch origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$CHECKED_OUT_SHA" != "$RELEASE_SHA" ]; then
            echo "Checked-out SHA does not equal the explicitly requested release SHA."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Release blocked: requested SHA is not the current main HEAD."
            exit 1
          fi

      - name: Require successful CI for the exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&status=completed&per_page=100" \
            > /tmp/battend-ci-runs.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/battend-ci-runs.json', 'utf8'));
          const sha = process.env.RELEASE_SHA;
          const ok = (data.workflow_runs || []).some((run) =>
            run.name === 'CI' &&
            run.head_sha === sha &&
            run.conclusion === 'success'
          );
          if (!ok) {
            console.error('Release blocked: no successful CI run exists for the exact release SHA.');
            process.exit(1);
          }
          console.log('Exact-SHA CI gate passed.');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Production configuration preflight
        run: npm run preflight:production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          EMAIL_PROVIDER: resend
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BILLING_MODE: ${{ inputs.billing_mode }}
          PAYMENT_PROVIDER: ${{ inputs.payment_provider }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
          PAYMOB_INTEGRATION_ID: ${{ secrets.PAYMOB_INTEGRATION_ID }}
          PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
          DB_CONNECTION_LIMIT: ${{ vars.DB_CONNECTION_LIMIT || '10' }}
          DB_POOL_TIMEOUT_SEC: ${{ vars.DB_POOL_TIMEOUT_SEC || '10' }}
          NEXT_PUBLIC_DEMO_MODE: "false"
          DEMO_SEED_CONFIRM: "false"
          RUN_PRISMA_MIGRATIONS: "true"

      - name: Check production migration state before deploy
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply tracked migrations once
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Verify production migration state
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Copy app to git-free staging dir
        run: |
          rm -rf /tmp/b-attend-production
          mkdir -p /tmp/b-attend-production
          tar --exclude=.git --exclude=node_modules --exclude=.next -cf - . | tar -xf - -C /tmp/b-attend-production

      - name: Deploy exact SHA to Vercel Production
        working-directory: /tmp/b-attend-production
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify production health and schema readiness
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          check_endpoint() {
            local endpoint="$1"
            local expected="$2"
            for attempt in $(seq 1 12); do
              if body="$(curl --fail --silent --show-error --max-time 10 "$APP_URL$endpoint" 2>/dev/null)" && echo "$body" | grep -q "$expected"; then
                echo "$endpoint passed on attempt $attempt."
                return 0
              fi
              sleep 5
            done
            echo "$endpoint did not become healthy within the release verification window."
            return 1
          }
          check_endpoint "/api/health" '"status":"ok"'
          check_endpoint "/api/ready" '"status":"ready"'

      - name: Release record
        run: |
          echo "Production release completed for SHA $RELEASE_SHA"
          echo "CI exact-SHA gate: passed"
          echo "Production preflight: passed"
          echo "Prisma migrate deploy: passed"
          echo "Health/readiness: passed"
