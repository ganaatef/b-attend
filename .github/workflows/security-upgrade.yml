name: Targeted Runtime Security Overrides

on:
  push:
    branches: [integration/main-reconcile]
    paths:
      - .github/workflows/security-upgrade.yml

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
  NEXT_PUBLIC_DEMO_MODE: "true"
  RUN_PRISMA_MIGRATIONS: "false"

jobs:
  overrides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Pin patched transitive dependencies
        run: |
          npm pkg set 'overrides.deepmerge-ts=^8.0.1'
          npm pkg set 'overrides.fast-uri=^3.1.6'
          npm pkg set 'overrides.nanoid=^3.3.18'
          npm install --package-lock-only
          npm ci
      - name: Require zero high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: i18n parity
        run: npm run i18n:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified dependency overrides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes"
          else
            git commit -m "fix(security): pin patched transitive dependencies"
            git push origin HEAD:integration/main-reconcile
          fi
