name: Targeted Runtime Security Upgrade

on:
  push:
    branches: [integration/main-reconcile]
    paths:
      - .github/workflows/security-upgrade.yml

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
  NEXT_PUBLIC_DEMO_MODE: "true"
  RUN_PRISMA_MIGRATIONS: "false"

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Upgrade directly exposed vulnerable runtime packages
        run: npm install --save next@16.3.3 sharp@0.35.4 react-syntax-highlighter@16.1.1 @mdxeditor/editor@4.2.3
      - name: Block remaining critical production advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: i18n parity
        run: npm run i18n:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified package upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes"
          else
            git commit -m "fix(security): patch critical runtime dependencies"
            git push origin HEAD:integration/main-reconcile
          fi
