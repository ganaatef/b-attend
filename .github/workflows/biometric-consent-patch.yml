name: Biometric consent patch

on:
  push:
    branches:
      - integration/face-liveness
    paths:
      - scripts/biometric-consent-patch.mjs

permissions:
  contents: write

jobs:
  patch-biometric-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/face-liveness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply biometric consent hardening
        run: node scripts/biometric-consent-patch.mjs
      - name: Commit hardened biometric consent policy
        run: |
          if git diff --quiet -- src/lib/attendance/biometric-identity.ts; then
            echo "Biometric consent policy already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/attendance/biometric-identity.ts
          git commit -m "fix(biometrics): enforce server-controlled consent version"
          git push origin HEAD:integration/face-liveness
