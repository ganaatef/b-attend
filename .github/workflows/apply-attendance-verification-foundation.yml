name: Guarded Attendance Verification Foundation

on:
  push:
    branches: [integration/main-reconcile]
    paths:
      - .github/attendance-verification.request

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  SESSION_SECRET: ci-test-secret-for-build-only-32chars!!
  NEXT_PUBLIC_DEMO_MODE: "true"
  RUN_PRISMA_MIGRATIONS: "false"

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/main-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply verification foundation patch
        run: node scripts/apply-attendance-verification-foundation.mjs
      - name: Format and verify schema
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
      - name: TypeScript check
        run: npm run typecheck
      - name: i18n parity check
        run: npm run i18n:check
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260910110000_attendance_verification_foundation messages/en.json messages/ar.json
          if git diff --cached --quiet; then
            echo "Foundation already applied"
          else
            git commit -m "feat(attendance): add verification challenge data model"
            git push origin HEAD:integration/main-reconcile
          fi
